# =============================================================================
# Kubernetes RBAC - Worker Service Account
# =============================================================================
# Defines minimal permissions for the OCR worker pods:
#   - Get/List/Watch pods and services
#   - Get/List/Watch/Create batch jobs
# =============================================================================

---
# Service account used by OCR worker pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dvp-worker-sa
  namespace: dvp
  labels:
    app: document-verification-portal

---
# Role with minimal permissions needed by workers
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dvp-worker-role
  namespace: dvp
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]

---
# Bind the service account to the role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dvp-worker-binding
  namespace: dvp
subjects:
  - kind: ServiceAccount
    name: dvp-worker-sa
    namespace: dvp
roleRef:
  kind: Role
  name: dvp-worker-role
  apiGroup: rbac.authorization.k8s.io/v1
